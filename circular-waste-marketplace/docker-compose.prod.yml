name: cwm-prod

networks:
  cwm-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
  nginx_certs:
  nginx_cache:

services:
  postgres:
    image: postgres:15.7-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [cwm-net]

  redis:
    image: redis:7.4-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [cwm-net]

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks: [cwm-net]

  backend:
    image: ghcr.io/${GITHUB_REPO_OWNER}/cwm-backend:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env
    environment:
      RUN_MIGRATIONS: "true"
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [cwm-net]
    expose: ["8000"]

  celery-worker:
    image: ghcr.io/${GITHUB_REPO_OWNER}/cwm-backend:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env
    environment:
      RUN_MIGRATIONS: "false"
      PYTHONPATH: /app
    command: ["celery", "-A", "app.workers.tasks:celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [cwm-net]

  celery-beat:
    image: ghcr.io/${GITHUB_REPO_OWNER}/cwm-backend:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env
    environment:
      RUN_MIGRATIONS: "false"
      PYTHONPATH: /app
    command: ["celery", "-A", "app.workers.tasks:celery_app", "beat", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_healthy
    networks: [cwm-net]

  frontend:
    image: ghcr.io/${GITHUB_REPO_OWNER}/cwm-frontend:${IMAGE_TAG:-latest}
    restart: always
    networks: [cwm-net]
    expose: ["80"]

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - backend
      - frontend
    networks: [cwm-net]
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot:latest
    restart: always
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"
