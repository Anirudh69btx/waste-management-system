name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.7
        env:
          POSTGRES_USER: cwm
          POSTGRES_PASSWORD: cwm
          POSTGRES_DB: cwm
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install deps
        run: |
          cd backend
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: cd backend && ruff check app/
      - name: Test
        env:
          DATABASE_URL: postgresql+asyncpg://cwm:cwm@localhost:5432/cwm
          DATABASE_URL_SYNC: postgresql://cwm:cwm@localhost:5432/cwm
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test_secret_64_chars_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          REFRESH_TOKEN_SECRET: test_refresh_64_chars_yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy
        run: cd backend && pytest app/tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: frontend/package-lock.json }
      - name: Install
        run: cd frontend && npm ci
      - name: Typecheck
        run: cd frontend && npx tsc --noEmit -p tsconfig.json
      - name: Test
        run: cd frontend && npm test -- --run
      - name: Build
        run: cd frontend && npm run build
